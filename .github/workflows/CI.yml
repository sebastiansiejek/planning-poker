name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        node-version: [24.14.0]

    name: Run all tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Retrieve Git history, needed to verify commits

      - name: Create env file with variables
        run: |
          echo NEXTAUTH_URL=${{ 'http://localhost:3000' }} >> .env
          echo NEXTAUTH_SECRET=$(openssl rand -base64 32) >> .env

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: pnpm dlx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Linter
        run: pnpm run lint

      - name: Type checking
        run: pnpm run check-types

      - name: Build
        run: pnpm run build

      - name: Set prisma provider
        run: |
          echo DATABASE_URL=${{ secrets.DATABASE_URL }} >> .env

      - name: Prepare prisma database
        run: pnpm dlx prisma migrate deploy

      - name: Install Playwright Browsers
        run: pnpm exec playwright install webkit --with-deps

      - name: Run run tests
        run: pnpm run test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
